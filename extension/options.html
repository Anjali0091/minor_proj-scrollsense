<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollSense Options</title>
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        max-width: 760px;
        margin: 24px auto;
        padding: 0 16px;
        color: #2f1e17;
        background: #fffaf6;
      }
      h1 {
        margin: 0;
      }
      .panel {
        display: grid;
        gap: 10px;
        background: #fff5ec;
        border: 1px solid #e4cdbb;
        border-radius: 12px;
        padding: 16px;
      }
      button {
        border: 0;
        border-radius: 10px;
        background: #2d1a13;
        color: #fff;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .outline {
        background: transparent;
        border: 1px solid #9a5d37;
        color: #7b4325;
      }
      .action-row {
        display: flex;
        gap: 10px;
      }
      .muted {
        color: #5f4437;
        margin: 0;
      }
      #status {
        margin: 4px 0 0;
        color: #644536;
        min-height: 22px;
      }
      #toast {
        position: fixed;
        right: 14px;
        bottom: 14px;
        background: #1f7a3d;
        color: #fff;
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        font-weight: 600;
      }
      #toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <h1>ScrollSense Extension Options</h1>
    <p class="muted">Frontend activation is now the primary setup flow.</p>
    <section class="panel">
      <p class="muted">1) Open the web app at http://localhost:5173</p>
      <p class="muted">2) Fill login, required details, and blocked domains</p>
      <p class="muted">3) Click Activate Protection in the web app</p>
      <p class="muted">4) Reload social tabs to apply updated rules</p>
      <div class="action-row">
        <button id="syncButton" type="button">Sync from backend now</button>
        <button id="deactivateButton" type="button" class="outline">Deactivate protection</button>
        <button id="openAppButton" type="button" class="outline">Open activation app</button>
      </div>
      <p id="status"></p>
    </section>
    <div id="toast" aria-live="polite"></div>

    <script src="options.js"></script>
  </body>
</html>
