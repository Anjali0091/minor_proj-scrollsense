<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollSense Settings</title>
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
        color: #2f1e17;
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: grid;
        gap: 12px;
        background: #fff8f1;
        border: 1px solid #e3cbb8;
        border-radius: 12px;
        padding: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      input {
        border: 1px solid #d6bea9;
        border-radius: 8px;
        padding: 8px;
        font: inherit;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 10px;
        background: #2d1a13;
        color: #fff;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        margin: 10px 0 0;
        color: #644536;
      }
    </style>
  </head>
  <body>
    <h1>ScrollSense Nudge Guard</h1>
    <form id="settings-form">
      <label class="row">
        <input id="enabled" type="checkbox" />
        <span>Enable extension on supported feeds</span>
      </label>

      <label>
        Backend API base URL
        <input id="apiBase" type="text" placeholder="http://localhost:5000" />
      </label>

      <label>
        Gentle nudge threshold (seconds)
        <input id="gentleSeconds" type="number" min="10" />
      </label>

      <label>
        Strong nudge threshold (seconds)
        <input id="strongSeconds" type="number" min="20" />
      </label>

      <label>
        Hard-stop threshold (seconds)
        <input id="hardStopSeconds" type="number" min="30" />
      </label>

      <label>
        Hard-stop cooldown (seconds)
        <input id="cooldownSeconds" type="number" min="5" />
      </label>

      <label>
        Allow-list domains (comma separated, optional)
        <input id="allowDomains" type="text" placeholder="youtube.com, x.com" />
      </label>

      <label>
        Block-list domains (comma separated)
        <input id="blockDomains" type="text" placeholder="m.youtube.com" />
      </label>

      <button type="submit">Save settings</button>
      <p id="status"></p>
    </form>

    <script src="options.js"></script>
  </body>
</html>
